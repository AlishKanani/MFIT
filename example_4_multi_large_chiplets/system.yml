# Power blocks (defined in chip-local coordinates)
power_blocks:
  # Chiplet 1 - full chip background power
  - chip: chiplet_1
    layer: chiplet-layer_1
    name: background
    rect: {x: 0.0, y: 0.0, lx: 10.0, ly: 20.0}
    max_power_w: 70.0
    trace: steady_100
  
  # Chiplet 2
  - chip: chiplet_2
    layer: chiplet-layer_1
    name: background
    rect: {x: 0.0, y: 0.0, lx: 10.0, ly: 20.0}
    max_power_w: 70.0
    trace: steady_100
  
